<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">SCAN</a>
    <a class="ghost link" href="index.html">Board</a>
  </header>
  <main id="board">
    <section class="card">
      <h2>About</h2>
      <p>Screen only. Not advice. Stocks scan walks the top 1,000 names by volume, keeps 5/5 passes, then marks BabyPips buy, hold, or sell.</p>
    </section>
  </main>
  <div id="diag" class="diag" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#111; color:#ccc; border-top:1px solid #444; padding:8px; font:12px monospace; max-height:40vh; overflow:auto; z-index:50;">
    <button type="button" id="diagClose" onclick="document.getElementById('diag').style.display='none'" style="float:right">close</button>
    <div id="diagLog"></div>
  </div>
  <button type="button" id="diagBtn" onclick="var p=document.getElementById('diag'); if(p) p.style.display = p.style.display==='none'?'block':'none';" style="position:fixed; bottom:8px; right:8px; z-index:40; background:#333; color:#fff; border:0; border-radius:6px; padding:6px 10px; font:12px sans-serif;">diag</button>
  <script src="scan-logic.js"></script>
  <script src="board.js"></script>
</body>
</html>
