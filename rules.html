<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rules</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">SCAN</div>
    <a class="ghost link" href="index.html">Board</a>
    <button type="button" id="themeBtn" class="ghost">Light</button>
  </header>
  <main id="board">
    <section class="card"><h2>Preset</h2><div class="picks"><button type="button" id="useDefault">Default</button><button type="button" id="save">Save</button></div><p class="muted" id="presetName"></p></section>
    <section class="card"><h2>Loose rules</h2><label>Trailing P/E under <input id="lpe" type="number" step="0.1" /></label><label>PEG under <input id="lpeg" type="number" step="0.1" /></label><label>EPS beat over % <input id="leps" type="number" step="0.1" /></label><label>D/E under <input id="lde" type="number" step="0.1" /></label><label>YoY revenue over % <input id="lyoy" type="number" step="0.1" /></label></section>
    <section class="card"><h2>Tight rules</h2><label>Trailing P/E under <input id="tpe" type="number" step="0.1" /></label><label>Forward P/E under <input id="tfpe" type="number" step="0.1" /></label><label>RSI from <input id="trlo" type="number" step="1" /></label><label>RSI to <input id="trhi" type="number" step="1" /></label><label>D/E under <input id="tde" type="number" step="0.1" /></label><label>EPS beat over % <input id="teps" type="number" step="0.1" /></label><label>QoQ revenue over % <input id="tqoq" type="number" step="0.1" /></label></section>
  </main>
  <script src="rules-page.js"></script>
</body>
</html>
